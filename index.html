      rel="stylesheet"
    />
    <script>
      // Apply saved or system theme before first paint to prevent a flash.
      (function () {
        try {
          var stored = localStorage.getItem('project-hub-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas-950 text-neutral-100 antialiased selection:bg-accent-amber/20 selection:text-amber-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
