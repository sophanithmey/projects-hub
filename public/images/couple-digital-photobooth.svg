<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="booth-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a12"/>
      <stop offset="50%" stop-color="#241221"/>
      <stop offset="100%" stop-color="#100812"/>
    </linearGradient>
    <linearGradient id="photo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#booth-bg)"/>
  <!-- Floating Hearts Background -->
  <g fill="#ec4899" fill-opacity="0.15">
    <circle cx="150" cy="120" r="30"/>
    <circle cx="1050" cy="180" r="45"/>
    <circle cx="200" cy="540" r="25"/>
    <circle cx="980" cy="520" r="35"/>
  </g>
  <!-- Photobooth Strip (4x6 Keepsake Card) -->
  <g transform="translate(600, 337)">
    <!-- White Paper Strip Card with shadow -->
    <rect x="-140" y="-280" width="280" height="560" rx="14" fill="#ffffff" stroke="#fbcfe8" stroke-width="4" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))"/>
    <!-- Photo 1 -->
    <rect x="-115" y="-255" width="230" height="100" rx="6" fill="#fce7f3"/>
    <circle cx="0" cy="-205" r="22" fill="#f472b6"/>
    <path d="M -30 -180 Q 0 -210 30 -180 Z" fill="#ec4899"/>
    <!-- Photo 2 -->
    <rect x="-115" y="-140" width="230" height="100" rx="6" fill="#fdf2f8"/>
    <text x="0" y="-80" text-anchor="middle" font-size="34">📸</text>
    <!-- Photo 3 -->
    <rect x="-115" y="-25" width="230" height="100" rx="6" fill="#fce7f3"/>
    <text x="0" y="35" text-anchor="middle" font-size="34">✌️✨</text>
    <!-- Photo 4 -->
    <rect x="-115" y="90" width="230" height="100" rx="6" fill="#fdf2f8"/>
    <text x="0" y="150" text-anchor="middle" font-size="34">💖</text>
    <!-- Bottom Footer Names & Date -->
    <text x="0" y="225" text-anchor="middle" fill="#db2777" font-family="'Pacifico', cursive, sans-serif" font-size="20" font-weight="700">Sweet Snap</text>
    <text x="0" y="250" text-anchor="middle" fill="#9d174d" font-family="sans-serif" font-size="11" font-weight="600">Alex &amp; Jordan · Forever &amp; Always</text>
  </g>
  <!-- Left Side Camera Controls Box -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="300" height="300" rx="20" fill="#1e101c" stroke="#3d1d36" stroke-width="1.5"/>
    <text x="24" y="45" fill="#f472b6" font-family="sans-serif" font-size="18" font-weight="700">Sweet Snap Photobooth</text>
    <text x="24" y="75" fill="#a8859f" font-size="13">4 or 6 cute photos in keepsake strip</text>
    <!-- Filter options -->
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="75" height="35" rx="8" fill="#db2777"/>
      <text x="37" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Normal</text>
      <rect x="85" y="0" width="75" height="35" rx="8" fill="#2d152a" stroke="#4a2345"/>
      <text x="122" y="22" text-anchor="middle" fill="#c084fc" font-size="12">B &amp; W</text>
      <rect x="170" y="0" width="75" height="35" rx="8" fill="#2d152a" stroke="#4a2345"/>
      <text x="207" y="22" text-anchor="middle" fill="#f59e0b" font-size="12">Sepia</text>
    </g>
    <!-- Big Capture Button -->
    <g transform="translate(24, 180)">
      <rect x="0" y="0" width="250" height="50" rx="25" fill="#db2777"/>
      <text x="125" y="31" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">✨ Start Photo Session</text>
    </g>
  </g>
</svg>
