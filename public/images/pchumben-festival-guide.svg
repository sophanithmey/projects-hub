<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="pben-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a05"/>
      <stop offset="50%" stop-color="#24130b"/>
      <stop offset="100%" stop-color="#0d0704"/>
    </linearGradient>
    <radialGradient id="pagoda-glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#pben-bg)"/>
  <!-- Pagoda Temple Spire Silhouette -->
  <circle cx="600" cy="360" r="260" fill="url(#pagoda-glow)"/>
  <g transform="translate(600, 360)">
    <!-- Pagoda roofs & spire -->
    <path d="M 0 -180 L 12 -80 L -12 -80 Z" fill="#f59e0b"/>
    <path d="M -80 -70 Q 0 -110 80 -70 L 60 -40 Q 0 -60 -60 -40 Z" fill="#d97706"/>
    <path d="M -140 -35 Q 0 -85 140 -35 L 110 5 Q 0 -35 -110 5 Z" fill="#b45309"/>
    <path d="M -220 10 Q 0 -60 220 10 L 180 70 Q 0 -10 -180 70 Z" fill="#78350f"/>
    <!-- Main base -->
    <rect x="-160" y="70" width="320" height="120" rx="10" fill="#451a03" stroke="#b45309" stroke-width="2"/>
    <!-- Temple entrance door arch -->
    <path d="M -40 190 L -40 110 Q 0 80 40 110 L 40 190 Z" fill="#140a05" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <!-- Floating Lotus Offerings & Candle Lanterns -->
  <g transform="translate(600, 560)">
    <circle cx="-250" cy="0" r="14" fill="#fbbf24"/>
    <circle cx="250" cy="0" r="14" fill="#fbbf24"/>
    <text x="-250" y="6" text-anchor="middle" font-size="16">🪔</text>
    <text x="250" y="6" text-anchor="middle" font-size="16">🪔</text>
  </g>
  <!-- Header Text Overlay -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="450" height="130" rx="16" fill="#1f110a" fill-opacity="0.9" stroke="#3b1f13" stroke-width="1.5"/>
    <text x="24" y="38" fill="#fbbf24" font-family="'Kantumruy Pro', sans-serif" font-size="22" font-weight="700">បុណ្យភ្ជុំបិណ្ឌ · PCHUM BEN</text>
    <text x="24" y="70" fill="#fef3c7" font-family="sans-serif" font-size="15" font-weight="600">Remember · Honor · Continue</text>
    <text x="24" y="98" fill="#a1755a" font-family="sans-serif" font-size="13">15-Day Digital Companion · Kan Ben Pagoda Guide</text>
  </g>
</svg>
