<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="50%" stop-color="#090a0d" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <radialGradient id="amberGlowTopRight" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlowBottomLeft" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0" />
    </radialGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="amberBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161922" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b4252" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e2330" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2d3748" fill-opacity="0.4" />
    </pattern>

    <!-- Filters -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />
  <rect width="1200" height="630" fill="url(#amberGlowTopRight)" />
  <rect width="1200" height="630" fill="url(#cyanGlowBottomLeft)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- LEFT COLUMN: Brand, Title, Badges -->
  <g transform="translate(80, 84)">
    <!-- Top Pill Badge -->
    <g>
      <rect width="270" height="38" rx="19" fill="#1e1b13" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
      <!-- Pulsing Dot -->
      <circle cx="22" cy="19" r="4.5" fill="#10b981" />
      <circle cx="22" cy="19" r="8" fill="#10b981" fill-opacity="0.25" />
      <text x="38" y="24" class="font-mono" font-size="13" font-weight="600" fill="#fbbf24" letter-spacing="1.5">
        LIVE VERCEL REGISTRY
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="120" class="font-sans" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Sophanith's Projects
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="168" class="font-sans" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.3">
      Curated showcase of high-performance web applications,
    </text>
    <text x="0" y="198" class="font-sans" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.3">
      financial calculators, and interactive cultural tools.
    </text>

    <!-- Tech Badges Row -->
    <g transform="translate(0, 240)">
      <!-- Tech Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="10" fill="#181b22" stroke="#2d3342" stroke-width="1" />
        <text x="65" y="22" text-anchor="middle" class="font-mono" font-size="13" font-weight="500" fill="#cbd5e1">Next.js &amp; React</text>
      </g>
      <!-- Tech Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="108" height="34" rx="10" fill="#181b22" stroke="#2d3342" stroke-width="1" />
        <text x="54" y="22" text-anchor="middle" class="font-mono" font-size="13" font-weight="500" fill="#cbd5e1">TypeScript</text>
      </g>
      <!-- Tech Badge 3 -->
      <g transform="translate(262, 0)">
        <rect width="112" height="34" rx="10" fill="#181b22" stroke="#2d3342" stroke-width="1" />
        <text x="56" y="22" text-anchor="middle" class="font-mono" font-size="13" font-weight="500" fill="#cbd5e1">Tailwind CSS</text>
      </g>
      <!-- Tech Badge 4 -->
      <g transform="translate(386, 0)">
        <rect width="106" height="34" rx="10" fill="#181b22" stroke="#2d3342" stroke-width="1" />
        <text x="53" y="22" text-anchor="middle" class="font-mono" font-size="13" font-weight="500" fill="#cbd5e1">Vercel Edge</text>
      </g>
    </g>

    <!-- Author & Domain Footer -->
    <g transform="translate(0, 390)">
      <!-- Avatar/Icon Box -->
      <rect width="52" height="52" rx="14" fill="url(#amberBrand)" filter="url(#shadowGlow)" />
      <!-- Stylized Compass / Monogram inside -->
      <path d="M 26 12 L 30 22 L 40 26 L 30 30 L 26 40 L 22 30 L 12 26 L 22 22 Z" fill="#090a0d" />

      <g transform="translate(68, 16)">
        <text x="0" y="8" class="font-sans" font-size="17" font-weight="700" fill="#f8fafc">
          Sophanith Mey
        </text>
        <text x="0" y="27" class="font-mono" font-size="13" font-weight="500" fill="#fbbf24">
          sophanith-projects.vercel.app
        </text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Elegant Bento Mockup Card Stack -->
  <g transform="translate(680, 84)">
    <!-- Main Showcase Bento Card -->
    <g filter="url(#cardShadow)">
      <!-- Card Frame -->
      <rect width="440" height="462" rx="24" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
      
      <!-- Top Window Header Bar -->
      <rect width="440" height="48" rx="24" fill="#14171f" />
      <rect y="24" width="440" height="24" fill="#14171f" />
      <line x1="0" y1="48" x2="440" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      
      <!-- Window Controls -->
      <circle cx="28" cy="24" r="5" fill="#ef4444" fill-opacity="0.8" />
      <circle cx="44" cy="24" r="5" fill="#f59e0b" fill-opacity="0.8" />
      <circle cx="60" cy="24" r="5" fill="#10b981" fill-opacity="0.8" />
      
      <!-- URL Bar pill -->
      <rect x="84" y="12" width="270" height="24" rx="12" fill="#090a0d" stroke="rgba(255,255,255,0.06)" />
      <text x="100" y="28" class="font-mono" font-size="11" fill="#64748b">https://sophanithmey.vercel.app</text>
      <circle cx="338" cy="24" r="3" fill="#10b981" />

      <!-- Card Inner Content: Miniature Project Showcase -->
      <!-- Project Item 1: Soursdey Weddings -->
      <g transform="translate(24, 68)">
        <rect width="392" height="110" rx="16" fill="#191d26" stroke="rgba(255,255,255,0.06)" />
        <rect x="16" y="16" width="78" height="78" rx="12" fill="#242b38" stroke="rgba(245,158,11,0.2)" />
        <path d="M 55 42 Q 55 35 48 35 Q 40 35 40 45 Q 40 60 55 70 Q 70 60 70 45 Q 70 35 62 35 Q 55 35 55 42" fill="#f59e0b" fill-opacity="0.7" />
        <text x="108" y="38" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">Soursdey Weddings</text>
        <text x="108" y="58" class="font-mono" font-size="11" fill="#fbbf24">// Culture &amp; Events</text>
        <text x="108" y="78" class="font-sans" font-size="12" fill="#94a3b8">Interactive Cambodian digital RSVP</text>
      </g>

      <!-- Project Item 2: EVKH Station -->
      <g transform="translate(24, 194)">
        <rect width="392" height="110" rx="16" fill="#191d26" stroke="rgba(255,255,255,0.06)" />
        <rect x="16" y="16" width="78" height="78" rx="12" fill="#242b38" stroke="rgba(6,182,212,0.2)" />
        <!-- EV Bolt -->
        <path d="M 57 32 L 47 54 L 54 54 L 51 72 L 65 48 L 57 48 Z" fill="#06b6d4" />
        <text x="108" y="38" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">EVKH Station Finder</text>
        <text x="108" y="58" class="font-mono" font-size="11" fill="#38bdf8">// Utilities &amp; Maps</text>
        <text x="108" y="78" class="font-sans" font-size="12" fill="#94a3b8">Real-time EV charger locator</text>
      </g>

      <!-- Project Item 3: Verify Bakong TRX -->
      <g transform="translate(24, 320)">
        <rect width="392" height="110" rx="16" fill="#191d26" stroke="rgba(255,255,255,0.06)" />
        <rect x="16" y="16" width="78" height="78" rx="12" fill="#242b38" stroke="rgba(16,185,129,0.2)" />
        <!-- Shield / Check -->
        <path d="M 55 35 L 67 40 V 55 C 67 64 55 72 55 72 C 55 72 43 64 43 55 V 40 Z" fill="none" stroke="#10b981" stroke-width="2.5" />
        <path d="M 49 52 L 53 56 L 61 47" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
        <text x="108" y="38" class="font-sans" font-size="16" font-weight="700" fill="#f1f5f9">Verify Bakong TRX</text>
        <text x="108" y="58" class="font-mono" font-size="11" fill="#34d399">// Fintech &amp; Tools</text>
        <text x="108" y="78" class="font-sans" font-size="12" fill="#94a3b8">Cryptographic payment validation</text>
      </g>
    </g>
  </g>
</svg>
