<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="lunar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17"/>
      <stop offset="50%" stop-color="#08152c"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#lunar-bg)"/>
  <!-- Stars in background -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="90" r="1.5"/>
    <circle cx="340" cy="140" r="2"/>
    <circle cx="890" cy="80" r="1.5"/>
    <circle cx="1040" cy="190" r="2"/>
    <circle cx="150" cy="520" r="1.5"/>
    <circle cx="980" cy="560" r="1.5"/>
    <circle cx="780" cy="480" r="2"/>
  </g>
  <!-- Main Glowing Moon Phase -->
  <circle cx="600" cy="270" r="180" fill="url(#moon-glow)"/>
  <circle cx="600" cy="270" r="100" fill="#fef9c3" stroke="#eab308" stroke-width="3"/>
  <!-- Moon Craters Simulation -->
  <circle cx="560" cy="240" r="16" fill="#fde047" opacity="0.6"/>
  <circle cx="630" cy="220" r="22" fill="#fde047" opacity="0.5"/>
  <circle cx="610" cy="310" r="28" fill="#fde047" opacity="0.5"/>
  <circle cx="550" cy="300" r="12" fill="#fde047" opacity="0.6"/>
  <!-- Title in Khmer & English -->
  <g transform="translate(600, 440)">
    <text x="0" y="0" text-anchor="middle" fill="#fef08a" font-family="'Moul', 'Kantumruy Pro', serif" font-size="28" font-weight="700">ប្រតិទិនចន្ទគតិខ្មែរ</text>
    <text x="0" y="32" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="600">Khmer Lunar Calendar &amp; Astronomy</text>
    <text x="0" y="60" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">Buddhist Holy Days (ថ្ងៃសីល) · 3D Moon Phase · Chhankitek Converter</text>
  </g>
  <!-- Mini Lunar Orbit Phases (New Moon, Quarter, Full Moon) -->
  <g transform="translate(600, 560)">
    <!-- Phase 1: Crescent -->
    <g transform="translate(-240, 0)">
      <circle cx="0" cy="0" r="20" fill="#1e293b"/>
      <path d="M 0 -20 A 20 20 0 0 1 0 20 A 10 20 0 0 0 0 -20 Z" fill="#fef08a"/>
      <text x="0" y="38" text-anchor="middle" fill="#94a3b8" font-size="11">៨ កើត</text>
    </g>
    <!-- Phase 2: Full Moon (15 Keut - Thngai Sila) -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="26" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
      <text x="0" y="44" text-anchor="middle" fill="#fef08a" font-size="12" font-weight="700">១៥ កើត (ពេញបូណ៌មី)</text>
      <rect x="-45" y="52" width="90" height="20" rx="4" fill="#854d0e"/>
      <text x="0" y="66" text-anchor="middle" fill="#fef08a" font-size="10" font-weight="700">⭐ ថ្ងៃសីល</text>
    </g>
    <!-- Phase 3: Waning Moon (14/15 Roc - Thngai Sila) -->
    <g transform="translate(240, 0)">
      <circle cx="0" cy="0" r="20" fill="#1e293b"/>
      <path d="M 0 -20 A 20 20 0 0 0 0 20 A 10 20 0 0 1 0 -20 Z" fill="#fef08a"/>
      <text x="0" y="38" text-anchor="middle" fill="#94a3b8" font-size="11">៨ រោច</text>
    </g>
  </g>
</svg>
