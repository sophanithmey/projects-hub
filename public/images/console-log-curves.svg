<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="curves-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080f"/>
      <stop offset="100%" stop-color="#121124"/>
    </linearGradient>
    <linearGradient id="bezier-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-curve">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#curves-bg)"/>
  <!-- Grid Matrix -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>
  <!-- Window Frame -->
  <rect x="100" y="70" width="1000" height="535" rx="16" fill="#100f1c" stroke="#26233d" stroke-width="1.5"/>
  <!-- Console header -->
  <rect x="100" y="70" width="1000" height="48" rx="16" fill="#171529" stroke="#26233d" stroke-width="1"/>
  <circle cx="130" cy="94" r="6" fill="#ef4444"/>
  <circle cx="150" cy="94" r="6" fill="#f59e0b"/>
  <circle cx="170" cy="94" r="6" fill="#10b981"/>
  <text x="200" y="99" fill="#a5b4fc" font-family="monospace" font-size="13">Curve Mirror // console.log(cubicBezier(0.42, 0, 0.58, 1))</text>
  <!-- Primary Bézier Curve -->
  <path d="M 180 500 C 350 140, 750 620, 1020 180" fill="none" stroke="url(#bezier-grad)" stroke-width="6" filter="url(#glow-curve)"/>
  <!-- Mirror Mirrored Curve -->
  <path d="M 180 180 C 350 540, 750 60, 1020 500" fill="none" stroke="url(#bezier-grad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  <!-- Tangent handles and control points -->
  <line x1="180" y1="500" x2="350" y2="140" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="350" cy="140" r="8" fill="#f43f5e"/>
  <line x1="1020" y1="180" x2="750" y2="620" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="750" cy="620" r="8" fill="#38bdf8"/>
  <!-- DevTools output badge -->
  <g transform="translate(140, 150)">
    <rect x="0" y="0" width="280" height="70" rx="10" fill="#1d1b33" stroke="#3b3766"/>
    <text x="16" y="28" fill="#c084fc" font-family="monospace" font-size="13">&gt; CSS ease-in-out curve</text>
    <text x="16" y="52" fill="#38bdf8" font-family="monospace" font-size="12">t: 0.65s | v: 84.2%</text>
  </g>
</svg>
