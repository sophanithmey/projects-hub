<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="ev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04140e"/>
      <stop offset="50%" stop-color="#06241a"/>
      <stop offset="100%" stop-color="#020d09"/>
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#ev-bg)"/>
  <!-- Map Radar Rings -->
  <circle cx="600" cy="337" r="260" fill="url(#radar-glow)"/>
  <circle cx="600" cy="337" r="100" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="600" cy="337" r="180" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="600" cy="337" r="260" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.2"/>
  <!-- Central EV Charging Pillar Graphic -->
  <g transform="translate(600, 337)">
    <!-- Base pillar -->
    <rect x="-60" y="-120" width="120" height="220" rx="18" fill="#0b241c" stroke="#10b981" stroke-width="3"/>
    <!-- Screen display on charger -->
    <rect x="-40" y="-95" width="80" height="70" rx="8" fill="#041710" stroke="#059669" stroke-width="1.5"/>
    <text x="0" y="-68" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">120 kW</text>
    <text x="0" y="-42" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="11">⚡ FAST DC</text>
    <!-- Lightning icon -->
    <path d="M 0 -10 L -12 25 L -2 25 L -8 55 L 14 15 L 2 15 Z" fill="#34d399"/>
    <!-- Charging plug cable -->
    <path d="M 60 -10 C 120 -10 130 90 90 120" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <circle cx="90" cy="120" r="14" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  </g>
  <!-- Cambodia Map EV Station Pin Markers -->
  <g>
    <!-- Phnom Penh -->
    <circle cx="640" cy="380" r="12" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
    <!-- Siem Reap -->
    <circle cx="480" cy="220" r="10" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
    <!-- Sihanoukville -->
    <circle cx="440" cy="460" r="10" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
    <!-- Battambang -->
    <circle cx="410" cy="240" r="8" fill="#34d399" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- Top HUD Overlay -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="460" height="140" rx="18" fill="#082218" fill-opacity="0.9" stroke="#124432" stroke-width="1.5"/>
    <text x="24" y="38" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">CAMBODIA EV DIRECTORY 2026</text>
    <text x="24" y="75" fill="#f0fdf4" font-family="sans-serif" font-size="24" font-weight="800">146+ Charging Stations</text>
    <text x="24" y="108" fill="#6ee7b7" font-family="sans-serif" font-size="13">Official EAC Data · CCS2 &amp; GB-T Plugs · Live GPS</text>
  </g>
</svg>
