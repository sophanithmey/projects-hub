<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="hol-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d12"/>
      <stop offset="50%" stop-color="#24141c"/>
      <stop offset="100%" stop-color="#0f090d"/>
    </linearGradient>
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hol-bg)"/>
  <!-- Decorative Cute Blobs -->
  <circle cx="200" cy="180" r="140" fill="#f43f5e" fill-opacity="0.1" filter="blur(40px)"/>
  <circle cx="1000" cy="480" r="180" fill="#fb7185" fill-opacity="0.1" filter="blur(50px)"/>
  <!-- Cute Calendar Card Frame -->
  <rect x="160" y="70" width="880" height="535" rx="24" fill="#1f141a" stroke="#3d212f" stroke-width="2"/>
  <!-- Top Cute Header -->
  <rect x="160" y="70" width="880" height="80" rx="24" fill="#2d1723" stroke="#3d212f" stroke-width="1"/>
  <text x="210" y="120" fill="#fda4af" font-family="'Nunito', sans-serif" font-size="28" font-weight="900">Holidays Buddy ✿</text>
  <text x="470" y="118" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="700">🇰🇭 Cambodia 2026</text>
  <!-- Pills -->
  <rect x="740" y="94" width="140" height="34" rx="17" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="810" y="116" text-anchor="middle" fill="#fecdd3" font-family="sans-serif" font-size="13" font-weight="700">✈️ AI Leave Planner</text>
  <rect x="895" y="94" width="115" height="34" rx="17" fill="#3d212f"/>
  <text x="952" y="116" text-anchor="middle" fill="#fda4af" font-family="sans-serif" font-size="13">⭐ Days Off</text>
  <!-- Calendar Grid Mockup -->
  <g transform="translate(210, 190)">
    <!-- Month Name -->
    <text x="0" y="24" fill="#fff1f2" font-family="sans-serif" font-size="20" font-weight="800">April 2026 · Khmer New Year</text>
    <!-- Days Grid -->
    <g transform="translate(0, 50)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="105" height="95" rx="14" fill="#281822" stroke="#3f2233"/>
      <text x="18" y="32" fill="#9f7e91" font-size="14">12</text>
      <rect x="120" y="0" width="105" height="95" rx="14" fill="#281822" stroke="#3f2233"/>
      <text x="138" y="32" fill="#9f7e91" font-size="14">13</text>
      <!-- Khmer New Year Days (Highlighted Cute Pink) -->
      <rect x="240" y="0" width="105" height="95" rx="14" fill="url(#pink-grad)" stroke="#fda4af" stroke-width="2"/>
      <text x="258" y="32" fill="#ffffff" font-size="16" font-weight="900">14</text>
      <text x="258" y="65" fill="#fff1f2" font-size="11" font-weight="700">ចូលឆ្នាំថ្មី ✿</text>
      <rect x="360" y="0" width="105" height="95" rx="14" fill="url(#pink-grad)" stroke="#fda4af" stroke-width="2"/>
      <text x="378" y="32" fill="#ffffff" font-size="16" font-weight="900">15</text>
      <text x="378" y="65" fill="#fff1f2" font-size="11" font-weight="700">វារៈវ័នបត</text>
      <rect x="480" y="0" width="105" height="95" rx="14" fill="url(#pink-grad)" stroke="#fda4af" stroke-width="2"/>
      <text x="498" y="32" fill="#ffffff" font-size="16" font-weight="900">16</text>
      <text x="498" y="65" fill="#fff1f2" font-size="11" font-weight="700">វារៈឡើងស័ក</text>
      <rect x="600" y="0" width="105" height="95" rx="14" fill="#281822" stroke="#3f2233"/>
      <text x="618" y="32" fill="#9f7e91" font-size="14">17</text>
      <rect x="720" y="0" width="105" height="95" rx="14" fill="#281822" stroke="#3f2233"/>
      <text x="738" y="32" fill="#9f7e91" font-size="14">18</text>
    </g>
  </g>
  <!-- Cute mascot sticker -->
  <g transform="translate(930, 480)">
    <circle cx="50" cy="50" r="45" fill="#f43f5e" stroke="#fff" stroke-width="3"/>
    <text x="50" y="62" text-anchor="middle" font-size="34">🍩</text>
  </g>
</svg>
