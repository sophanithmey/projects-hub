<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="park-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#181c24"/>
    </linearGradient>
    <radialGradient id="pin-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#park-bg)"/>
  <!-- Map Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="250" y1="0" x2="250" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="550" y1="0" x2="550" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="850" y1="0" x2="850" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- Parking Lot Slots -->
  <g stroke="#f5c842" stroke-opacity="0.25" stroke-width="2" fill="none">
    <rect x="250" y="240" width="150" height="240"/>
    <rect x="400" y="240" width="150" height="240"/>
    <rect x="550" y="240" width="150" height="240"/>
    <rect x="700" y="240" width="150" height="240"/>
  </g>
  <!-- Active Spot Glow -->
  <circle cx="625" cy="360" r="180" fill="url(#pin-glow)"/>
  <!-- Radar Wave -->
  <circle cx="625" cy="360" r="90" fill="none" stroke="#f5c842" stroke-width="2" opacity="0.6"/>
  <circle cx="625" cy="360" r="140" fill="none" stroke="#f5c842" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
  <!-- Car Silhouette / Marker -->
  <g transform="translate(625, 360)">
    <!-- Pin Icon -->
    <path d="M 0 -70 C -35 -70 -50 -40 -50 -10 C -50 25 0 70 0 70 C 0 70 50 25 50 -10 C 50 -40 35 -70 0 -70 Z" fill="#f5c842" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="-20" r="24" fill="#0f1117"/>
    <text x="0" y="-12" text-anchor="middle" fill="#f5c842" font-family="sans-serif" font-size="24" font-weight="900">P</text>
  </g>
  <!-- HUD Card Overlay -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="340" height="150" rx="16" fill="#131720" fill-opacity="0.9" stroke="#232936" stroke-width="1.5"/>
    <div xmlns="http://www.w3.org/1999/xhtml"></div>
    <text x="24" y="38" fill="#f5c842" font-family="monospace" font-size="13" font-weight="700">WHERE DID I PARK?</text>
    <text x="24" y="75" fill="#f3f4f6" font-family="sans-serif" font-size="26" font-weight="800">Spot B2 · Slot 42</text>
    <text x="24" y="110" fill="#9ca3af" font-family="sans-serif" font-size="14">📍 Aeon Mall Sen Sok · 35m away</text>
  </g>
</svg>
