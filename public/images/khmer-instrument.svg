<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="khmer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0908"/>
      <stop offset="50%" stop-color="#18110e"/>
      <stop offset="100%" stop-color="#080605"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow-gold">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#khmer-bg)"/>
  <!-- Decorative Cultural Border -->
  <rect x="40" y="40" width="1120" height="595" rx="20" fill="#140f0c" fill-opacity="0.8" stroke="#3d281a" stroke-width="1.5"/>
  <rect x="52" y="52" width="1096" height="571" rx="14" fill="none" stroke="#d97706" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6 6"/>
  <!-- Header Bar -->
  <g transform="translate(80, 80)">
    <text x="0" y="32" fill="#fbbf24" font-family="'Cinzel', 'Kantumruy Pro', serif" font-size="28" font-weight="700">ឧបករណ៍ភ្លេងខ្មែរ · KHMER INSTRUMENTS</text>
    <text x="0" y="60" fill="#a89078" font-family="sans-serif" font-size="14">Classical Pinpeat &amp; Mohori Heritage Synthesizer · 48kHz Web Audio</text>
  </g>
  <!-- Roneat Ek (Traditional Khmer Xylophone Boat Curve) -->
  <g transform="translate(600, 390)">
    <!-- Base stand -->
    <rect x="-100" y="120" width="200" height="30" rx="8" fill="#522f18" stroke="#78350f" stroke-width="2"/>
    <path d="M -50 120 L -30 60 L 30 60 L 50 120 Z" fill="#78350f"/>
    <!-- Curved sound box (Boat shape) -->
    <path d="M -420 -20 Q -240 100 0 100 Q 240 100 420 -20 Q 360 40 0 40 Q -360 40 -420 -20 Z" fill="#9a3412" stroke="url(#gold-grad)" stroke-width="3"/>
    <!-- Xylophone Bamboo Bars / Keys -->
    <g fill="#d97706" stroke="#451a03" stroke-width="1.5">
      <rect x="-360" y="-35" width="22" height="70" rx="3" transform="rotate(-18 -349 0)"/>
      <rect x="-320" y="-28" width="22" height="70" rx="3" transform="rotate(-14 -309 7)"/>
      <rect x="-280" y="-20" width="22" height="70" rx="3" transform="rotate(-10 -269 15)"/>
      <rect x="-240" y="-12" width="22" height="70" rx="3" transform="rotate(-7 -229 23)"/>
      <rect x="-200" y="-5" width="22" height="70" rx="3" transform="rotate(-4 -189 30)"/>
      <rect x="-160" y="0" width="22" height="70" rx="3" transform="rotate(-2 -149 35)"/>
      <rect x="-120" y="5" width="22" height="70" rx="3"/>
      <rect x="-80" y="8" width="22" height="70" rx="3"/>
      <rect x="-40" y="10" width="22" height="70" rx="3"/>
      <rect x="0" y="10" width="22" height="70" rx="3" fill="#fbbf24"/>
      <rect x="40" y="10" width="22" height="70" rx="3"/>
      <rect x="80" y="8" width="22" height="70" rx="3"/>
      <rect x="120" y="5" width="22" height="70" rx="3"/>
      <rect x="160" y="0" width="22" height="70" rx="3" transform="rotate(2 171 35)"/>
      <rect x="200" y="-5" width="22" height="70" rx="3" transform="rotate(4 211 30)"/>
      <rect x="240" y="-12" width="22" height="70" rx="3" transform="rotate(7 251 23)"/>
      <rect x="280" y="-20" width="22" height="70" rx="3" transform="rotate(10 291 15)"/>
      <rect x="320" y="-28" width="22" height="70" rx="3" transform="rotate(14 331 7)"/>
      <rect x="360" y="-35" width="22" height="70" rx="3" transform="rotate(18 371 0)"/>
    </g>
    <!-- Mallets -->
    <line x1="-80" y1="-70" x2="-20" y2="10" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-80" cy="-70" r="14" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
    <line x1="80" y1="-70" x2="20" y2="10" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="-70" r="14" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <!-- Soundwave Visualizer -->
  <path d="M 120 220 Q 300 170 480 210 T 840 200 T 1080 230" fill="none" stroke="url(#gold-grad)" stroke-width="3" filter="url(#glow-gold)" opacity="0.7"/>
</svg>
