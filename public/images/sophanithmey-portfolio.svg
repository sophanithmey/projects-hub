<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="folio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b"/>
      <stop offset="50%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181b22"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>
    <radialGradient id="ambient-gold" cx="60%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="folio-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222734" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#folio-bg)"/>
  <rect width="1200" height="675" fill="url(#folio-grid)"/>
  <circle cx="750" cy="220" r="380" fill="url(#ambient-gold)"/>

  <!-- Browser Container Window -->
  <rect x="80" y="60" width="1040" height="555" rx="16" fill="url(#card-grad)" stroke="#272b38" stroke-width="2"/>

  <!-- Window Header -->
  <rect x="80" y="60" width="1040" height="48" rx="16" fill="#14171f"/>
  <rect x="80" y="92" width="1040" height="16" fill="#14171f"/>
  <line x1="80" y1="108" x2="1120" y2="108" stroke="#232734" stroke-width="1.5"/>

  <!-- Window Controls -->
  <circle cx="112" cy="84" r="6" fill="#ef4444"/>
  <circle cx="132" cy="84" r="6" fill="#f59e0b"/>
  <circle cx="152" cy="84" r="6" fill="#10b981"/>

  <!-- URL Bar -->
  <rect x="200" y="70" width="480" height="28" rx="6" fill="#0c0e14" stroke="#272b38" stroke-width="1"/>
  <circle cx="218" cy="84" r="4" fill="#10b981"/>
  <text x="232" y="89" fill="#9ca3af" font-family="monospace" font-size="12">https://sophanithmey.vercel.app</text>

  <!-- Status pill -->
  <rect x="940" y="72" width="150" height="24" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <circle cx="956" cy="84" r="3.5" fill="#10b981"/>
  <text x="968" y="88" fill="#e5e7eb" font-family="monospace" font-size="10" font-weight="600">AVAILABLE 2026</text>

  <!-- Left Hero Content -->
  <g transform="translate(140, 160)">
    <text x="0" y="32" fill="#f59e0b" font-family="monospace" font-size="14" letter-spacing="4" font-weight="700">SOPHANITH MEY — PORTFOLIO</text>

    <text x="0" y="110" fill="#f9fafb" font-family="sans-serif" font-weight="900" font-size="64" letter-spacing="-2">FRONTEND</text>
    <text x="0" y="175" fill="url(#gold-grad)" font-family="serif" font-style="italic" font-weight="400" font-size="54">Developer &amp; Architect</text>

    <text x="0" y="230" fill="#9ca3af" font-family="sans-serif" font-size="16" font-weight="300">
      <tspan x="0" dy="0">Crafting thoughtful digital experiences, design systems,</tspan>
      <tspan x="0" dy="24">and high-performance web applications at Wingmall.</tspan>
    </text>

    <!-- Stat Badges -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="110" height="56" rx="8" fill="#10131a" stroke="#232734" stroke-width="1"/>
      <text x="16" y="28" fill="#fbbf24" font-family="sans-serif" font-size="22" font-weight="800">4+</text>
      <text x="16" y="44" fill="#6b7280" font-family="monospace" font-size="9" letter-spacing="1">YRS EXP</text>

      <rect x="126" y="0" width="110" height="56" rx="8" fill="#10131a" stroke="#232734" stroke-width="1"/>
      <text x="142" y="28" fill="#fbbf24" font-family="sans-serif" font-size="22" font-weight="800">20+</text>
      <text x="142" y="44" fill="#6b7280" font-family="monospace" font-size="9" letter-spacing="1">PROJECTS</text>

      <rect x="252" y="0" width="140" height="56" rx="8" fill="#10131a" stroke="#232734" stroke-width="1"/>
      <text x="268" y="28" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="700">1st Class</text>
      <text x="268" y="44" fill="#6b7280" font-family="monospace" font-size="9" letter-spacing="1">HONOURS</text>
    </g>
  </g>

  <!-- Right Visual Preview & Tech Cards -->
  <g transform="translate(680, 150)">
    <!-- Interactive Wireframe Card -->
    <rect x="0" y="0" width="380" height="230" rx="12" fill="#0d1017" stroke="#242938" stroke-width="1.5"/>
    <rect x="16" y="16" width="348" height="28" rx="6" fill="#171b26"/>
    <text x="32" y="34" fill="#e5e7eb" font-family="monospace" font-size="11">SPN // Selected Works</text>

    <!-- Mini project previews -->
    <rect x="16" y="56" width="168" height="74" rx="6" fill="#121622" stroke="#232838" stroke-width="1"/>
    <text x="28" y="78" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">Bakong Verifier</text>
    <text x="28" y="96" fill="#6b7280" font-family="monospace" font-size="9">Fintech · QR Auth</text>

    <rect x="196" y="56" width="168" height="74" rx="6" fill="#121622" stroke="#232838" stroke-width="1"/>
    <text x="208" y="78" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600">Holiday Buddy</text>
    <text x="208" y="96" fill="#6b7280" font-family="monospace" font-size="9">Productivity · Calendar</text>

    <rect x="16" y="140" width="168" height="74" rx="6" fill="#121622" stroke="#232838" stroke-width="1"/>
    <text x="28" y="162" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="600">Digital Weddings</text>
    <text x="28" y="180" fill="#6b7280" font-family="monospace" font-size="9">Culture · Audio RSVP</text>

    <rect x="196" y="140" width="168" height="74" rx="6" fill="#121622" stroke="#232838" stroke-width="1"/>
    <text x="208" y="162" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Khmer Instruments</text>
    <text x="208" y="180" fill="#6b7280" font-family="monospace" font-size="9">Web Audio · Heritage</text>

    <!-- Tech Stack Pill Group -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="85" height="30" rx="15" fill="#171b26" stroke="#272b3a" stroke-width="1"/>
      <text x="18" y="19" fill="#9ca3af" font-family="monospace" font-size="10">Next.js</text>

      <rect x="95" y="0" width="95" height="30" rx="15" fill="#171b26" stroke="#272b3a" stroke-width="1"/>
      <text x="110" y="19" fill="#9ca3af" font-family="monospace" font-size="10">TypeScript</text>

      <rect x="200" y="0" width="85" height="30" rx="15" fill="#171b26" stroke="#272b3a" stroke-width="1"/>
      <text x="216" y="19" fill="#9ca3af" font-family="monospace" font-size="10">React</text>

      <rect x="295" y="0" width="85" height="30" rx="15" fill="#171b26" stroke="#272b3a" stroke-width="1"/>
      <text x="309" y="19" fill="#9ca3af" font-family="monospace" font-size="10">Tailwind</text>
    </g>

    <g transform="translate(0, 292)">
      <rect x="0" y="0" width="115" height="30" rx="15" fill="#171b26" stroke="#272b3a" stroke-width="1"/>
      <text x="16" y="19" fill="#9ca3af" font-family="monospace" font-size="10">Framer Motion</text>

      <rect x="125" y="0" width="95" height="30" rx="15" fill="#171b26" stroke="#272b3a" stroke-width="1"/>
      <text x="140" y="19" fill="#9ca3af" font-family="monospace" font-size="10">Zustand</text>

      <rect x="230" y="0" width="90" height="30" rx="15" fill="#171b26" stroke="#272b3a" stroke-width="1"/>
      <text x="245" y="19" fill="#9ca3af" font-family="monospace" font-size="10">Vercel</text>
    </g>
  </g>
</svg>
