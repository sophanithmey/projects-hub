<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#fin-bg)"/>
  <!-- UI Card: Finance Dashboard -->
  <rect x="140" y="65" width="920" height="545" rx="20" fill="#131e33" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="140" y="65" width="920" height="60" rx="20" fill="#17253f" stroke="#1e293b" stroke-width="1"/>
  <text x="180" y="103" fill="#60a5fa" font-family="sans-serif" font-size="18" font-weight="800">Finance Toolkit · Everyday Life Helper</text>
  <!-- Discount Calculator Panel -->
  <g transform="translate(180, 160)">
    <rect x="0" y="0" width="400" height="400" rx="16" fill="#17223b" stroke="#253556"/>
    <text x="24" y="38" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="700">🏷️ Discount Calculator</text>
    <!-- Original Price -->
    <text x="24" y="85" fill="#94a3b8" font-size="13">Original Price</text>
    <rect x="24" y="98" width="350" height="48" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="44" y="128" fill="#f8fafc" font-family="monospace" font-size="18">$ 120.00</text>
    <!-- Discount Percentage Slider / Chips -->
    <text x="24" y="180" fill="#94a3b8" font-size="13">Discount Rate</text>
    <g transform="translate(24, 195)">
      <rect x="0" y="0" width="75" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="37" y="24" text-anchor="middle" fill="#94a3b8" font-size="13">10%</text>
      <rect x="90" y="0" width="75" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="127" y="24" text-anchor="middle" fill="#94a3b8" font-size="13">20%</text>
      <rect x="180" y="0" width="75" height="38" rx="8" fill="url(#blue-grad)"/>
      <text x="217" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">30%</text>
      <rect x="270" y="0" width="75" height="38" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="307" y="24" text-anchor="middle" fill="#94a3b8" font-size="13">50%</text>
    </g>
    <!-- Result Card -->
    <rect x="24" y="260" width="350" height="110" rx="12" fill="#0c4a6e" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.5"/>
    <text x="44" y="295" fill="#38bdf8" font-size="13">You Pay (Saved $36.00)</text>
    <text x="44" y="345" fill="#38bdf8" font-family="sans-serif" font-size="36" font-weight="800">$ 84.00</text>
  </g>
  <!-- Expense Splitter / Loan Preview Panel -->
  <g transform="translate(610, 160)">
    <rect x="0" y="0" width="410" height="400" rx="16" fill="#17223b" stroke="#253556"/>
    <text x="24" y="38" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="700">👥 Bill Splitter &amp; Loan Amortization</text>
    <!-- Split pill -->
    <rect x="24" y="70" width="360" height="80" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="44" y="105" fill="#94a3b8" font-size="13">Dinner Total ($240.00 / 4 friends)</text>
    <text x="44" y="133" fill="#10b981" font-family="monospace" font-size="20" font-weight="700">$ 60.00 per person</text>
    <!-- Loan Schedule item -->
    <rect x="24" y="170" width="360" height="200" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="44" y="205" fill="#94a3b8" font-size="13">Monthly Loan Repayment</text>
    <text x="44" y="240" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="800">$ 438.71 / mo</text>
    <text x="44" y="275" fill="#64748b" font-size="12">Principal: $10,000 | Interest: 5.2% | 24 Months</text>
    <!-- Mini progress bar -->
    <rect x="44" y="300" width="320" height="10" rx="5" fill="#1e293b"/>
    <rect x="44" y="300" width="220" height="10" rx="5" fill="#10b981"/>
    <text x="44" y="340" fill="#34d399" font-size="12">📊 Export to Excel &amp; PDF</text>
  </g>
</svg>
